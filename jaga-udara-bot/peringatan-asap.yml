name: Peringatan asap

on:
  schedule:
    # Jam UTC. 23, 05, 11, 17 UTC = 06.00, 12.00, 18.00, 00.00 WIB.
    # GitHub kadang menjalankan jadwal terlambat 5-30 menit.
    - cron: "0 23,5,11,17 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "otomatis / harian / cek"
        required: false
        default: "otomatis"
      coba:
        description: "Isi 'ya' untuk uji coba tanpa mengirim pesan"
        required: false
        default: "tidak"

permissions:
  contents: write

concurrency:
  group: peringatan-asap
  cancel-in-progress: false

jobs:
  jalankan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        # semua file bot ada di dalam folder jaga-udara-bot/
        working-directory: jaga-udara-bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: jaga-udara-bot/requirements.txt

      - run: pip install -r requirements.txt

      - name: Uji dasar
        run: python -m unittest discover tests

      - name: Jalankan bot
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_KALTENG: ${{ secrets.TELEGRAM_CHAT_KALTENG }}
          TELEGRAM_CHAT_KALBAR: ${{ secrets.TELEGRAM_CHAT_KALBAR }}
          TELEGRAM_CHAT_KALSEL: ${{ secrets.TELEGRAM_CHAT_KALSEL }}
          TELEGRAM_CHAT_RIAU: ${{ secrets.TELEGRAM_CHAT_RIAU }}
          TELEGRAM_CHAT_JAMBI: ${{ secrets.TELEGRAM_CHAT_JAMBI }}
          TELEGRAM_CHAT_SUMSEL: ${{ secrets.TELEGRAM_CHAT_SUMSEL }}
          WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}
        run: |
          ARGS="--mode ${{ github.event.inputs.mode || 'otomatis' }}"
          if [ "${{ github.event.inputs.coba }}" = "ya" ]; then ARGS="$ARGS --coba"; fi
          python -m bot.main $ARGS

      - name: Simpan arsip dan status ke repo
        if: always()
        run: |
          git config user.name "jaga-udara-bot"
          git config user.email "jaga-udara-bot@users.noreply.github.com"
          mkdir -p arsip state
          git add arsip state
          git diff --cached --quiet || git commit -m "Arsip $(TZ=Asia/Jakarta date '+%Y-%m-%d %H.%M') WIB"
          git push || echo "Push gagal (mungkin bentrok), akan dicoba di putaran berikutnya"
