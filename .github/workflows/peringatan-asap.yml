name: Peringatan asap

on:
  schedule:
    # Pemicu UTAMA: cron-job.org menekan "Run workflow" (pemicu=eksternal) tepat
    # pukul 00.01, 03.01, 06.01, ... WIB. Lihat jaga-udara-bot/docs/PANDUAN-CRON-JOB.md.
    # Jadwal GitHub di bawah hanya CADANGAN (sering telat/terlewat). Kalau slot itu
    # sudah dikirim oleh cron-job.org, bot melewatinya, jadi pesan tidak dobel.
    # Jam UTC 23, 02, 05, ... = 06, 09, 12, 15, 18, 21, 00, 03 WIB, menit :20.
    - cron: "20 2-23/3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "otomatis = sesuai jam; harian = paksa kirim ringkasan; cek = hanya kalau status naik"
        required: false
        type: choice
        options: [otomatis, harian, cek]
        default: otomatis
      coba:
        description: "ya = uji coba tanpa mengirim pesan"
        required: false
        type: choice
        options: ["tidak", "ya"]
        default: "tidak"
      provinsi:
        description: "Kosongkan untuk semua provinsi, atau isi mis. kalbar,kalsel,kaltim,kaltara"
        required: false
        default: ""
      pemicu:
        description: "Diisi otomatis oleh cron-job.org (eksternal). Biarkan 'manual'."
        required: false
        type: choice
        options: [manual, eksternal]
        default: manual

permissions:
  contents: write

concurrency:
  group: peringatan-asap
  cancel-in-progress: false

jobs:
  jalankan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        # semua file bot ada di dalam folder jaga-udara-bot/
        working-directory: jaga-udara-bot
    steps:
      - uses: actions/checkout@v4
        with:
          # ambil versi TERBARU cabang saat run mulai (bukan saat dipicu), supaya status dari
          # run sebelumnya (slot yang sudah dikirim) terbaca dan pesan tidak dobel
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: jaga-udara-bot/requirements.txt

      - run: pip install -r requirements.txt

      - name: Uji dasar
        run: python -m unittest discover tests

      - name: Jalankan bot
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_KALTENG: ${{ secrets.TELEGRAM_CHAT_KALTENG }}
          TELEGRAM_CHAT_KALBAR: ${{ secrets.TELEGRAM_CHAT_KALBAR }}
          TELEGRAM_CHAT_KALSEL: ${{ secrets.TELEGRAM_CHAT_KALSEL }}
          TELEGRAM_CHAT_KALTIM: ${{ secrets.TELEGRAM_CHAT_KALTIM }}
          TELEGRAM_CHAT_KALTARA: ${{ secrets.TELEGRAM_CHAT_KALTARA }}
          TELEGRAM_CHAT_RIAU: ${{ secrets.TELEGRAM_CHAT_RIAU }}
          TELEGRAM_CHAT_JAMBI: ${{ secrets.TELEGRAM_CHAT_JAMBI }}
          TELEGRAM_CHAT_SUMSEL: ${{ secrets.TELEGRAM_CHAT_SUMSEL }}
          WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}
          # Isian tombol Run dilewatkan lewat env, tidak ditempel langsung ke skrip,
          # supaya tidak bisa disisipi perintah shell.
          MODE: ${{ inputs.mode || 'otomatis' }}
          COBA: ${{ inputs.coba }}
          PROVINSI: ${{ inputs.provinsi }}
          PEMICU: ${{ inputs.pemicu }}
        run: |
          ARGS=(--mode "$MODE")
          if [ "$COBA" = "ya" ]; then ARGS+=(--coba); fi
          if [ -n "$PROVINSI" ]; then
            if ! [[ "$PROVINSI" =~ ^[a-z,]+$ ]]; then echo "Isian provinsi tidak valid: hanya huruf kecil dan koma"; exit 1; fi
            ARGS+=(--provinsi "$PROVINSI")
          fi
          python -m bot.main "${ARGS[@]}"

      - name: Simpan arsip dan status ke repo
        if: always()
        run: |
          git config user.name "jaga-udara-bot"
          git config user.email "jaga-udara-bot@users.noreply.github.com"
          mkdir -p arsip state
          git add arsip state
          git diff --cached --quiet || git commit -m "Arsip $(TZ=Asia/Jakarta date '+%Y-%m-%d %H.%M') WIB"
          # Ambil perubahan terbaru dulu (run lain atau suntingan Anda). Kalau bentrok di state/,
          # isi dari run ini yang dipakai (paling baru); log-jadwal.csv digabung (lihat .gitattributes).
          for i in 1 2 3; do
            if git pull --rebase -X theirs --autostash && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::warning::Push arsip/status gagal 3 kali"
